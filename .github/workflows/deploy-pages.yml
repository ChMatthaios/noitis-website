name: Deploy Noitis to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_SITE_URL: ${{ vars.NOITIS_SITE_URL }}
  NOITIS_CUSTOM_DOMAIN: ${{ vars.NOITIS_CUSTOM_DOMAIN }}
  VITE_AGENTGATE_PUBLIC_URL: ${{ vars.AGENTGATE_PUBLIC_URL }}
  VITE_AUTOPAYLOT_PUBLIC_URL: ${{ vars.AUTOPAYLOT_PUBLIC_URL }}
  VITE_BRS_PUBLIC_URL: ${{ vars.BRS_PUBLIC_URL }}
  VITE_EARNLOGIC_PUBLIC_URL: ${{ vars.EARNLOGIC_PUBLIC_URL }}
  VITE_FAMILYOS_PUBLIC_URL: ${{ vars.FAMILYOS_PUBLIC_URL }}
  VITE_LEGACYCI_PUBLIC_URL: ${{ vars.LEGACYCI_PUBLIC_URL }}
  VITE_AGENTGATE_PRICING_URL: ${{ vars.AGENTGATE_PRICING_URL }}
  VITE_AUTOPAYLOT_PRICING_URL: ${{ vars.AUTOPAYLOT_PRICING_URL }}
  VITE_BRS_PRICING_URL: ${{ vars.BRS_PRICING_URL }}
  VITE_EARNLOGIC_PRICING_URL: ${{ vars.EARNLOGIC_PRICING_URL }}
  VITE_FAMILYOS_PRICING_URL: ${{ vars.FAMILYOS_PRICING_URL }}
  VITE_LEGACYCI_PRICING_URL: ${{ vars.LEGACYCI_PRICING_URL }}

jobs:
  build:
    name: Build website
    if: ${{ vars.NOITIS_PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate production publication configuration
        run: npm run check:production

      - name: Validate and build
        run: npm run check

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Deploy website
    if: ${{ vars.NOITIS_PAGES_ENABLED == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
