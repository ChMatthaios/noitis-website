name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  VITE_SITE_URL: https://noitis-mc.github.io/noitis-website/

jobs:
  web:
    name: Website build and quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate production-safe URL configuration
        run: npm run check:production

      - name: Validate build, links, metadata and quality budgets
        run: npm run check

      - name: Install browser smoke tooling
        run: npm install --no-save --package-lock=false playwright@1.62.1

      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser smoke review
        run: npm run check:browser
